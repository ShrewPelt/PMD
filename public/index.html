<script>
const TILE = 48;
let DEX = "0004";

const SPECIES = {
  "0004": { walk: { fw: 32, fh: 32, cols: 4 }, idle: { fw: 32, fh: 40, cols: 4 } },
  "0025": { walk: { fw: 32, fh: 40, cols: 4 }, idle: { fw: 40, fh: 56, cols: 6 } },
  "0133": { walk: { fw: 40, fh: 48, cols: 7 }, idle: { fw: 24, fh: 32, cols: 2 } },
  "0495": { walk: { fw: 32, fh: 32, cols: 4 }, idle: { fw: 32, fh: 40, cols: 4 } }
};

const DIR_ORDER = ["down", "downright", "right", "upright", "up", "upleft", "left", "downleft"];

const SPECIES_BASE = "https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/sprite/";
const loadedSpecies = {};
const loadingSpecies = {};

function parseAnimDims(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, "text/xml");
  const anims = doc.getElementsByTagName("Anim");
  const out = {};
  for (let i = 0; i < anims.length; i++) {
    const nameEl = anims[i].getElementsByTagName("Name")[0];
    if (!nameEl) continue;
    const name = nameEl.textContent;
    if (name !== "Walk" && name !== "Idle") continue;
    const fwEl = anims[i].getElementsByTagName("FrameWidth")[0];
    const fhEl = anims[i].getElementsByTagName("FrameHeight")[0];
    const durs = anims[i].getElementsByTagName("Duration");
    if (!fwEl || !fhEl || durs.length === 0) continue;
    out[name.toLowerCase()] = { fw: parseInt(fwEl.textContent, 10), fh: parseInt(fhEl.textContent, 10), cols: durs.length };
  }
  return out;
}

function buildSpeciesAnims(scene, dex, dims) {
  for (let d = 0; d < 8; d++) {
    const dir = DIR_ORDER[d];
    if (!scene.anims.exists(dex + "_walk_" + dir)) {
      scene.anims.create({ key: dex + "_walk_" + dir, frames: scene.anims.generateFrameNumbers(dex + "_walk", { start: d * dims.walk.cols, end: d * dims.walk.cols + dims.walk.cols - 1 }), frameRate: 8, repeat: -1 });
    }
    if (!scene.anims.exists(dex + "_idle_" + dir)) {
      scene.anims.create({ key: dex + "_idle_" + dir, frames: scene.anims.generateFrameNumbers(dex + "_idle", { start: d * dims.idle.cols, end: d * dims.idle.cols + dims.idle.cols - 1 }), frameRate: 4, repeat: -1 });
    }
  }
}

function loadSpecies(scene, dex, cb) {
  if (!dex) { cb("0004"); return; }
  if (loadedSpecies[dex] === true) { cb(dex); return; }
  if (loadedSpecies[dex] === false) { cb("0004"); return; }
  if (loadingSpecies[dex]) { loadingSpecies[dex].push(cb); return; }
  loadingSpecies[dex] = [cb];
  const done = (okDex) => {
    const list = loadingSpecies[dex] || [];
    delete loadingSpecies[dex];
    for (const fn of list) fn(okDex);
  };
  fetch(SPECIES_BASE + dex + "/AnimData.xml").then((r) => {
    if (!r.ok) throw new Error("no anim data");
    return r.text();
  }).then((xml) => {
    const dims = parseAnimDims(xml);
    if (!dims.walk) { loadedSpecies[dex] = false; done("0004"); return; }
    if (!dims.idle) dims.idle = dims.walk;
    scene.load.spritesheet(dex + "_walk", SPECIES_BASE + dex + "/Walk-Anim.png", { frameWidth: dims.walk.fw, frameHeight: dims.walk.fh });
    scene.load.spritesheet(dex + "_idle", SPECIES_BASE + dex + "/Idle-Anim.png", { frameWidth: dims.idle.fw, frameHeight: dims.idle.fh });
    scene.load.once("complete", () => {
      if (scene.textures.exists(dex + "_walk") && scene.textures.exists(dex + "_idle")) {
        buildSpeciesAnims(scene, dex, dims);
        loadedSpecies[dex] = true;
        done(dex);
      } else {
        loadedSpecies[dex] = false;
        done("0004");
      }
    });
    scene.load.start();
  }).catch(() => { loadedSpecies[dex] = false; done("0004"); });
}

let MAP = [
  "############################",
  "############################",
  "##.......#########........##",
  "##.......#########........##",
  "##........................##",
  "##.......####..###........##",
  "##.......####..###........##",
  "#############..#############",
  "###########......###########",
  "###########......###########",
  "###########......###########",
  "###########......###########",
  "#############..#############",
  "##........###..###........##",
  "##........###..###........##",
  "##........................##",
  "##........########........##",
  "##........########........##",
  "############################",
  "############################"
];

const DELTAS = {
  up: { dc: 0, dr: -1 },
  down: { dc: 0, dr: 1 },
  left: { dc: -1, dr: 0 },
  right: { dc: 1, dr: 0 },
  upleft: { dc: -1, dr: -1 },
  upright: { dc: 1, dr: -1 },
  downleft: { dc: -1, dr: 1 },
  downright: { dc: 1, dr: 1 }
};

const EMOTIONS = ["Angry", "Crying", "Determined", "Dizzy", "Happy", "Inspired", "Joyous", "Normal", "Pain", "Sad", "Shouting", "Sigh", "Special0", "Special1", "Special2", "Special3", "Stunned", "Surprised", "Teary-Eyed", "Worried"];
const EMOTION_LOOKUP = {};
for (let i = 0; i < EMOTIONS.length; i++) {
  EMOTION_LOOKUP[EMOTIONS[i].toLowerCase()] = EMOTIONS[i];
}

const BASE_SLOTS = 10;
let invCapacity = BASE_SLOTS;
let invSheet = { coins: 0, accessories: { back: null, neck: null, head: null }, capacity: BASE_SLOTS };

const config = {
  type: Phaser.AUTO,
  width: 640,
  height: 480,
  pixelArt: true,
  parent: "game",
  scale: document.documentElement.classList.contains("touch") ? { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: 640, height: 480 } : undefined,
  backgroundColor: "#1a1a2e",
  loader: { crossOrigin: "anonymous" },
  scene: {
    preload: preload,
    create: create,
    update: update
  }
};

let player;
let turnCount = 1;
let stepCount = 0;
let state = "input";
let lockedAction = null;

let sceneRef;
let chatActive = false;
let moveKeys = null;
let viewStep = 0;
let viewRot = 0;
let comboKey = "";
let comboSince = 0;
let VIEW_SIGN = 1;
let isGM = false;
let barsGfx;
let socket = null;
let myId = null;
const otherPlayers = {};
const bubbles = {};

let inventoryOpen = false;
let playerHp = 40;
let playerMaxHp = 40;
const inventoryItems = [{ name: "Oran Berry", count: 3 }, { name: "Apple", count: 1 }];
let itemIndex = {};

let floorItems = [];
const floorItemSprites = {};
let selectedSlot = -1;
const ITEM_LIFT = 10;

let mapGraphics = null;

function drawMap() {
  if (!mapGraphics) return;
  mapGraphics.clear();
  for (let r = 0; r < MAP.length; r++) {
    for (let c = 0; c < MAP[r].length; c++) {
      const isWall = MAP[r][c] === "#";
      mapGraphics.fillStyle(isWall ? 0x24243a : 0x3a3a55, 1);
      mapGraphics.fillRect(c * TILE, r * TILE, TILE - 2, TILE - 2);
    }
  }
}

const STATUS_ICONS = { attack: ["PhysicalSword", "AttackDown"], spAtk: ["SpecialSword", "SpecialSwordDown"], defense: ["PhysicalShield", "DefenseDown"], spDef: ["SpecialShield", "SpecialShieldDown"], speed: ["SpeedUp", "SpeedDown"] };
const STATUS_ICON_ORDER = ["attack", "spAtk", "defense", "spDef", "speed"];
const statusPool = [];
let statusUsed = 0;

function statusSlot() {
  let slot = statusPool[statusUsed];
  if (!slot) {
    const img = sceneRef.add.image(0, 0, "ico_PhysicalSword");
    img.setOrigin(0.5, 0);
    img.setDepth(150);
    const txt = sceneRef.add.text(0, 0, "", { fontFamily: "sans-serif", fontSize: "9px", color: "#ffffff", stroke: "#000000", strokeThickness: 2 });
    txt.setOrigin(1, 1);
    txt.setDepth(151);
    slot = { img: img, txt: txt };
    statusPool[statusUsed] = slot;
  }
  statusUsed++;
  return slot;
}

function drawStatusIcons(s) {
  if (!s.stages || !sceneRef) return;
  const keys = [];
  for (const stat of STATUS_ICON_ORDER) {
    if (s.stages[stat]) keys.push(stat);
  }
  if (keys.length === 0) return;
  const gap = 17;
  const total = keys.length * gap;
  const off = s.feetOff !== undefined ? s.feetOff : TILE / 2 - 2;
  const bx = s.x + off * Math.sin(viewRot);
  const by = s.y + off * Math.cos(viewRot);
  const cosr = Math.cos(viewRot);
  const sinr = Math.sin(viewRot);
  for (let i = 0; i < keys.length; i++) {
    const stat = keys[i];
    const val = s.stages[stat];
    const slot = statusSlot();
    const lx = -total / 2 + i * gap + gap / 2;
    const ly = 29;
    const wx = bx + lx * cosr + ly * sinr;
    const wy = by - lx * sinr + ly * cosr;
    slot.img.setTexture("ico_" + STATUS_ICONS[stat][val > 0 ? 0 : 1]);
    slot.img.setDisplaySize(15, 15);
    slot.img.setRotation(-viewRot);
    slot.img.setPosition(wx, wy);
    slot.img.setVisible(true);
    const tx = lx + 8;
    const ty = ly + 16;
    slot.txt.setText(Math.abs(val) > 1 ? String(Math.abs(val)) : "");
    slot.txt.setRotation(-viewRot);
    slot.txt.setPosition(bx + tx * cosr + ty * sinr, by - tx * sinr + ty * cosr);
    slot.txt.setVisible(true);
  }
}

function preload() {
  for (const stat in STATUS_ICONS) {
    for (const nm of STATUS_ICONS[stat]) this.load.image("ico_" + nm, "combaticons/" + nm + ".png");
  }
  for (const dex in SPECIES) {
    const s = SPECIES[dex];
    this.load.spritesheet(dex + "_walk", "sprites/" + dex + "/Walk-Anim.png", { frameWidth: s.walk.fw, frameHeight: s.walk.fh });
    this.load.spritesheet(dex + "_idle", "sprites/" + dex + "/Idle-Anim.png", { frameWidth: s.idle.fw, frameHeight: s.idle.fh });
  }
}

function create() {
  sceneRef = this;

  fetch("items-index.json").then((r) => r.json()).then((data) => {
    itemIndex = data;
    renderAllFloorItems(sceneRef);
    if (inventoryOpen) refreshInventoryPanel();
  }).catch(() => {});

  connectMultiplayer(this);

  mapGraphics = this.add.graphics();
  drawMap();

  for (const dex in SPECIES) {
    const s = SPECIES[dex];
    for (let d = 0; d < 8; d++) {
      const dir = DIR_ORDER[d];
      this.anims.create({ key: dex + "_walk_" + dir, frames: this.anims.generateFrameNumbers(dex + "_walk", { start: d * s.walk.cols, end: d * s.walk.cols + s.walk.cols - 1 }), frameRate: 8, repeat: -1 });
      this.anims.create({ key: dex + "_idle_" + dir, frames: this.anims.generateFrameNumbers(dex + "_idle", { start: d * s.idle.cols, end: d * s.idle.cols + s.idle.cols - 1 }), frameRate: 4, repeat: -1 });
    }
    loadedSpecies[dex] = true;
  }

  player = this.add.sprite(0, 0, DEX + "_idle");
  player.setOrigin(0.5, 1);
  player.setScale(1.5);
  player.col = 13;
  player.row = 9;
  player.direction = "down";
  player.x = tilePixelX(player.col);
  player.y = tilePixelY(player.row);
  player.play(DEX + "_idle_down");
  player.setDepth(10);

  this.cameras.main.setBounds(0, 0, MAP[0].length * TILE, MAP.length * TILE);
  this.cameras.main.startFollow(player, true, 0.12, 0.12);

  this.input.on("pointermove", (pointer) => {
    if (!isGM || !pointer.isDown || window.worldGmActive) return;
    const cam = this.cameras.main;
    cam.scrollX = cam.scrollX - (pointer.x - pointer.prevPosition.x) / cam.zoom;
    cam.scrollY = cam.scrollY - (pointer.y - pointer.prevPosition.y) / cam.zoom;
  });
  this.input.on("wheel", (pointer, over, dx, dy) => {
    if (!isGM || window.worldGmActive) return;
    const cam = this.cameras.main;
    let z = cam.zoom - dy * 0.001;
    if (z < 0.3) z = 0.3;
    if (z > 2.5) z = 2.5;
    cam.setZoom(z);
  });

  const endBtn = document.getElementById("endSession");
  endBtn.addEventListener("click", () => {
    if (!isGM) return;
    if (!window.confirm("End this dungeon session?")) return;
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ type: "endSession" }));
    }
  });

  barsGfx = this.add.graphics();
  barsGfx.setDepth(400);

  updateReadout("none");

  const kb = this.input.keyboard;
  moveKeys = kb.addKeys("W,A,S,D", false);
  kb.removeCapture("W,A,S,D,Q,E,I,T,F,G,R,H,J,K,L,B,O,P");
  kb.on("keydown-Q", (e) => { if (e.repeat || chatActive || isGM) return; rotateView(1); });
  kb.on("keydown-E", (e) => { if (e.repeat || chatActive || isGM) return; rotateView(-1); });
  kb.on("keydown-H", (e) => { if (e.repeat || chatActive) return; lockAction(this, { type: "attack", slot: 1 }); });
  kb.on("keydown-J", (e) => { if (e.repeat || chatActive) return; lockAction(this, { type: "attack", slot: 2 }); });
  kb.on("keydown-K", (e) => { if (e.repeat || chatActive) return; lockAction(this, { type: "attack", slot: 3 }); });
  kb.on("keydown-L", (e) => { if (e.repeat || chatActive) return; lockAction(this, { type: "attack", slot: 4 }); });
  kb.on("keydown-T", (e) => { if (e.repeat || chatActive || isGM) return; if (typeof itemMenuTry === "function" && itemMenuTry()) return; if (typeof worldInteract === "function") worldInteract(); });
  kb.on("keydown-I", (e) => { if (e.repeat || chatActive) return; toggleInventory(); });
  kb.on("keydown-F", (e) => { if (e.repeat || chatActive || isGM) return; attemptPickup(); });
  kb.on("keydown-G", (e) => { if (e.repeat || chatActive || isGM) return; attemptDrop(); });
  kb.on("keydown-R", (e) => { if (e.repeat || chatActive || isGM) return; lockAction(this, { type: "use" }); });
  kb.on("keydown-SPACE", (e) => {
    if (chatActive) return;
    e.preventDefault();
  });

  const input = document.getElementById("chatInput");
  input.addEventListener("focus", () => { chatActive = true; });
  input.addEventListener("blur", () => { chatActive = false; });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const value = input.value.trim();
      if (value.length > 0) {
        if (isGM) {
          sendGmChat(value);
          addGmLine(value, Date.now());
        } else {
          showBubble(value);
        }
      }
      input.value = "";
    }
  });
}

const VIEW_VEC = {
  down: [0, 1], downright: [1, 1], right: [1, 0], upright: [1, -1],
  up: [0, -1], upleft: [-1, -1], left: [-1, 0], downleft: [-1, 1]
};

function vecToDir(x, y) {
  for (const name in VIEW_VEC) {
    if (VIEW_VEC[name][0] === x && VIEW_VEC[name][1] === y) return name;
  }
  return null;
}

function quarterTurns() {
  return ((viewStep % 4) + 4) % 4;
}

function rotateVecClockwise(v, turns) {
  let x = v[0];
  let y = v[1];
  for (let i = 0; i < turns; i++) {
    const nx = -y;
    const ny = x;
    x = nx;
    y = ny;
  }
  return [x, y];
}

function screenToWorldDir(screenVec) {
  const turns = (4 - quarterTurns()) % 4;
  const v = rotateVecClockwise(screenVec, turns);
  return vecToDir(v[0], v[1]);
}

function worldToScreenDir(dir) {
  const v = VIEW_VEC[dir];
  if (!v) return dir;
  const r = rotateVecClockwise(v, quarterTurns());
  return vecToDir(r[0], r[1]);
}

function rotateView(delta) {
  if (isGM) return;
  const cam = sceneRef.cameras.main;
  cam.removeBounds();
  viewStep = viewStep + delta;
  updateReadout(delta > 0 ? "camera left" : "camera right");
}

function updateViewRotation() {
  const target = viewStep * (Math.PI / 2) * VIEW_SIGN;
  const diff = target - viewRot;
  if (Math.abs(diff) < 0.002) {
    viewRot = target;
  } else {
    viewRot = viewRot + diff * 0.22;
  }
  sceneRef.cameras.main.setRotation(viewRot);
  const counter = -viewRot;
  if (player) {
    player.feetOff = (TILE / 2 - 2) - (hasFloorItemAt(player.col, player.row) ? ITEM_LIFT : 0);
    player.setOrigin(0.5, player.atkAnim ? 0.5 + (24 - player.feetOff) / (player.height * player.scaleY) : 1 - player.feetOff / (player.height * player.scaleY));
    player.setRotation(counter);
  }
  for (const id in otherPlayers) {
    const sp = otherPlayers[id];
    if (sp && sp !== "loading") {
      sp.feetOff = TILE / 2 - 2;
      sp.setOrigin(0.5, sp.atkAnim ? 0.5 + (24 - sp.feetOff) / (sp.height * sp.scaleY) : 1 - sp.feetOff / (sp.height * sp.scaleY));
      sp.setRotation(counter);
    }
  }
  for (const key in worldObjectPool) {
    worldObjectPool[key].setRotation(worldObjectPool[key].objRotRad ? worldObjectPool[key].objRotRad : counter);
  }
  for (const key in floorItemSprites) {
    floorItemSprites[key].setRotation(counter);
  }
}

function syncSpriteFacing(sp) {
  if (!sp || !sp.anims || !sp.anims.currentAnim || !sp.direction) return;
  const current = sp.anims.currentAnim.key;
  if (current.indexOf("_a_") !== -1) return;
  const kind = current.indexOf("_walk_") !== -1 ? "walk" : "idle";
  const dex = current.split("_")[0];
  const want = dex + "_" + kind + "_" + worldToScreenDir(sp.direction);
  if (current !== want) sp.play(want, true);
}

function pollMovement() {
  if (!moveKeys || isGM || chatActive || state !== "input") {
    comboKey = "";
    return;
  }
  const sx = (moveKeys.D.isDown ? 1 : 0) - (moveKeys.A.isDown ? 1 : 0);
  const sy = (moveKeys.S.isDown ? 1 : 0) - (moveKeys.W.isDown ? 1 : 0);
  if (sx === 0 && sy === 0) {
    comboKey = "";
    return;
  }
  const key = sx + "," + sy;
  const now = Date.now();
  if (key !== comboKey) {
    comboKey = key;
    comboSince = now;
    return;
  }
  if (now - comboSince < 45) return;
  const dir = screenToWorldDir([sx, sy]);
  if (!dir) return;
  if (typeof combatBlocksMove === "function" && combatBlocksMove()) return;
  player.direction = dir;
  sendMove(dir);
  state = "moving";
}

function update() {
  updateViewRotation();
  if (typeof worldFrame === "function") worldFrame(sceneRef);
  pollMovement();
  syncSpriteFacing(player);
  for (const id in otherPlayers) {
    syncSpriteFacing(otherPlayers[id]);
  }
  for (const key in bubbles) {
    if (bubbles[key].visible) {
      positionBubbleObj(bubbles[key]);
    }
  }
  drawBars();
}

function hpColor(r) {
  if (r > 0.5) return 0x3ec13e;
  if (r > 0.25) return 0xe0c020;
  return 0xd83030;
}

function drawEntityBars(s) {
  const w = 34;
  const h = 4;
  const x = -w / 2;
  const y = 4;
  const hpRatio = s.maxHp > 0 ? Math.max(0, Math.min(1, s.hp / s.maxHp)) : 0;
  const mpRatio = s.maxMp > 0 ? Math.max(0, Math.min(1, s.mp / s.maxMp)) : 0;

  const off = s.feetOff !== undefined ? s.feetOff : TILE / 2 - 2;
  barsGfx.save();
  barsGfx.translateCanvas(s.x + off * Math.sin(viewRot), s.y + off * Math.cos(viewRot));
  barsGfx.rotateCanvas(-viewRot);

  barsGfx.fillStyle(0x000000, 0.55);
  barsGfx.fillRect(x - 1, y - 1, w + 2, h + 2);
  barsGfx.fillStyle(0x2a2a2a, 1);
  barsGfx.fillRect(x, y, w, h);
  barsGfx.fillStyle(hpColor(hpRatio), 1);
  barsGfx.fillRect(x, y, w * hpRatio, h);

  const y2 = y + h + 2;
  barsGfx.fillStyle(0x000000, 0.55);
  barsGfx.fillRect(x - 1, y2 - 1, w + 2, h + 2);
  barsGfx.fillStyle(0x2a2a2a, 1);
  barsGfx.fillRect(x, y2, w, h);
  barsGfx.fillStyle(0x3a8bd4, 1);
  barsGfx.fillRect(x, y2, w * mpRatio, h);

  barsGfx.restore();
  drawStatusIcons(s);
}

function drawBars() {
  if (!barsGfx) return;
  barsGfx.clear();
  statusUsed = 0;
  if (!isGM && player.visible && player.maxHp) {
    drawEntityBars(player);
  }
  for (const id in otherPlayers) {
    const s = otherPlayers[id];
    if (s && s !== "loading" && s.maxHp) {
      drawEntityBars(s);
    }
  }
  for (let i = statusUsed; i < statusPool.length; i++) {
    statusPool[i].img.setVisible(false);
    statusPool[i].txt.setVisible(false);
  }
}

function tilePixelX(col) {
  return col * TILE + TILE / 2;
}

function tilePixelY(row) {
  return row * TILE + TILE / 2;
}

function isFloor(col, row) {
  if (row < 0 || row >= MAP.length) return false;
  if (col < 0 || col >= MAP[row].length) return false;
  return MAP[row][col] === ".";
}

function onDirection(scene, dir) {
  if (isGM || state !== "input") return;

  if (player.direction !== dir) {
    player.direction = dir;
    player.play(DEX + "_idle_" + dir);
    updateReadout("face " + dir);
    sendFace();
    return;
  }

  if (typeof combatBlocksMove === "function" && combatBlocksMove()) return;
  sendMove(dir);
  state = "moving";
}

function lockAction(scene, action) {
  if (isGM || state !== "input") return;
  if (typeof worldPlayerMode !== "undefined" && worldPlayerMode) return;

  lockedAction = action;
  state = "locked";
  updateReadout("LOCKED " + describeAction(action));

  scene.time.delayedCall(220, () => resolveTurn(scene));
}

function resolveTurn(scene) {
  state = "resolving";
  endTurn();
}

function endTurn() {
  lockedAction = null;
  state = "input";
  updateReadout("turn ready");
}

function ensureItemTexture(scene, name, cb) {
  const key = "item_" + name;
  if (scene.textures.exists(key)) {
    cb(key);
    return;
  }
  const iconPath = itemIndex[name];
  if (!iconPath) {
    cb(null);
    return;
  }
  scene.load.image(key, encodeURI(iconPath));
  scene.load.once("complete", () => {
    cb(scene.textures.exists(key) ? key : null);
  });
  scene.load.start();
}

function renderFloorItem(scene, item) {
  const key = item.col + "," + item.row;
  if (floorItemSprites[key]) return;
  ensureItemTexture(scene, item.name, (texKey) => {
    if (!texKey) return;
    if (floorItemSprites[key]) return;
    const img = scene.add.image(item.col * TILE + TILE / 2, item.row * TILE + TILE / 2, texKey);
    img.setDisplaySize(30, 30);
    img.setDepth(5);
    floorItemSprites[key] = img;
  });
}

function renderAllFloorItems(scene) {
  for (let i = 0; i < floorItems.length; i++) {
    renderFloorItem(scene, floorItems[i]);
  }
}

function removeFloorItemSprite(col, row) {
  const key = col + "," + row;
  if (floorItemSprites[key]) {
    floorItemSprites[key].destroy();
    delete floorItemSprites[key];
  }
}

function canAcceptItem(name) {
  for (let i = 0; i < inventoryItems.length; i++) {
    if (inventoryItems[i].name === name) return true;
  }
  return inventoryItems.length < slotCount();
}

function addToInventory(name) {
  let stack = null;
  for (let i = 0; i < inventoryItems.length; i++) {
    if (inventoryItems[i].name === name) { stack = inventoryItems[i]; break; }
  }
  if (stack) {
    stack.count = stack.count + 1;
  } else {
    inventoryItems.push({ name: name, count: 1 });
  }
  updateReadout("picked up " + name);
  if (inventoryOpen) refreshInventoryPanel();
}

function attemptPickup() {
  let item = null;
  for (let i = 0; i < floorItems.length; i++) {
    if (floorItems[i].col === player.col && floorItems[i].row === player.row) { item = floorItems[i]; break; }
  }
  if (!item) { updateReadout("nothing to pick up"); return; }
  if (!canAcceptItem(item.name)) { updateReadout("bag full"); return; }
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "pickup" }));
  }
}

function attemptDrop() {
  if (selectedSlot < 0 || !inventoryItems[selectedSlot]) { updateReadout("select an item first"); return; }
  const name = inventoryItems[selectedSlot].name;
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "drop", name: name }));
  }
}

function removeFromInventory(name) {
  for (let i = 0; i < inventoryItems.length; i++) {
    if (inventoryItems[i].name === name) {
      inventoryItems[i].count = inventoryItems[i].count - 1;
      if (inventoryItems[i].count <= 0) {
        inventoryItems.splice(i, 1);
        if (selectedSlot === i) selectedSlot = -1;
      }
      break;
    }
  }
  if (inventoryOpen) refreshInventoryPanel();
}

function hasFloorItemAt(col, row) {
  for (let i = 0; i < floorItems.length; i++) {
    if (floorItems[i].col === col && floorItems[i].row === row) {
      return true;
    }
  }
  return false;
}

function playerRestingY(col, row) {
  return tilePixelY(row);
}

function updatePlayerLift() {
  player.y = playerRestingY(player.col, player.row);
}

function parseMessage(raw) {
  let emotion = "Normal";
  const tags = raw.match(/\[[^\]]+\]/g);
  if (tags) {
    for (let i = 0; i < tags.length; i++) {
      const inner = tags[i].slice(1, -1).trim().toLowerCase();
      if (EMOTION_LOOKUP[inner]) {
        emotion = EMOTION_LOOKUP[inner];
        break;
      }
    }
  }
  const text = raw.replace(/\[[^\]]*\]/g, "").replace(/\s+/g, " ").trim();
  return { text: text, emotion: emotion };
}

function makeBubble(scene) {
  const gfx = scene.add.graphics();
  gfx.setDepth(500);
  const txt = scene.add.text(0, 0, "", { fontSize: "13px", color: "#222233", fontFamily: "sans-serif", wordWrap: { width: 200 } });
  txt.setDepth(501);
  const portrait = scene.add.image(0, 0, "__DEFAULT");
  portrait.setDepth(501);
  portrait.setDisplaySize(48, 48);
  portrait.setVisible(false);
  return { gfx: gfx, txt: txt, portrait: portrait, target: null, timer: null, visible: false };
}

const CHATLOG = { max: 200, unread: 0, collapsed: false, range: 10, ready: false };

function chatLogCollapse(on) {
  CHATLOG.collapsed = on;
  const box = document.getElementById("chatlog");
  if (!box) return;
  box.classList.toggle("collapsed", on);
  document.getElementById("chatlogtoggle").textContent = on ? "Show" : "Hide";
  if (!on) CHATLOG.unread = 0;
  chatLogTitle();
  try { localStorage.setItem("pmdChatLogCollapsed", on ? "1" : "0"); } catch (e) {}
  if (!on) {
    const body = document.getElementById("chatlogbody");
    body.scrollTop = body.scrollHeight;
  }
}

function chatLogTitle() {
  const t = document.getElementById("chatlogtitle");
  if (!t) return;
  const touch = document.documentElement.classList.contains("touch");
  t.textContent = (touch ? "Chat" : "Nearby chat (" + CHATLOG.range + " tiles)") + (CHATLOG.collapsed && CHATLOG.unread > 0 ? " | " + CHATLOG.unread + " new" : "");
}

function chatLogClamp(box) {
  const rect = box.getBoundingClientRect();
  const maxLeft = Math.max(0, window.innerWidth - Math.min(rect.width, window.innerWidth));
  const maxTop = Math.max(0, window.innerHeight - 40);
  box.style.left = Math.min(Math.max(0, rect.left), maxLeft) + "px";
  box.style.top = Math.min(Math.max(0, rect.top), maxTop) + "px";
}

function chatLogEnableDrag(box, head) {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("pmdChatLogPos") || "null"); } catch (e) {}
  if (saved && typeof saved.left === "number" && typeof saved.top === "number") {
    box.style.left = saved.left + "px";
    box.style.top = saved.top + "px";
    chatLogClamp(box);
  }
  let drag = null;
  head.style.cursor = "move";
  head.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0 || (ev.target && ev.target.closest && ev.target.closest("button"))) return;
    const rect = box.getBoundingClientRect();
    drag = { id: ev.pointerId, dx: ev.clientX - rect.left, dy: ev.clientY - rect.top, sx: ev.clientX, sy: ev.clientY, active: false };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  });
  const move = (ev) => {
    if (!drag || ev.pointerId !== drag.id) return;
    if (!drag.active && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) < 5) return;
    drag.active = true;
    box.style.left = (ev.clientX - drag.dx) + "px";
    box.style.top = (ev.clientY - drag.dy) + "px";
    chatLogClamp(box);
    ev.preventDefault();
  };
  const up = (ev) => {
    if (!drag || ev.pointerId !== drag.id) return;
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", up);
    if (drag.active) {
      CHATLOG.moved = true;
      setTimeout(() => { CHATLOG.moved = false; }, 0);
      const rect = box.getBoundingClientRect();
      try { localStorage.setItem("pmdChatLogPos", JSON.stringify({ left: rect.left, top: rect.top })); } catch (e) {}
    }
    drag = null;
  };
  window.addEventListener("resize", () => chatLogClamp(box));
}

function chatLogShow() {
  const box = document.getElementById("chatlog");
  if (!box) return;
  if (!CHATLOG.ready) {
    CHATLOG.ready = true;
    let saved = null;
    try { saved = localStorage.getItem("pmdChatLogCollapsed"); } catch (e) {}
    const startCollapsed = saved === "1";
    const head = document.getElementById("chatloghead");
    head.addEventListener("click", () => {
      if (CHATLOG.moved) {
        CHATLOG.moved = false;
        return;
      }
      chatLogCollapse(!CHATLOG.collapsed);
    });
    if (!document.documentElement.classList.contains("touch")) chatLogEnableDrag(box, head);
    chatLogCollapse(startCollapsed);
  }
  box.classList.remove("hidden");
}

function chatLogAdd(name, dex, text, emotion, mine, ts) {
  if (typeof worldPlayerMode === "undefined" || !worldPlayerMode) return;
  if (!text) return;
  chatLogShow();
  const body = document.getElementById("chatlogbody");
  const empty = body.querySelector(".clempty");
  if (empty) empty.remove();
  const stick = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
  const row = document.createElement("div");
  row.className = "clrow" + (mine ? " mine" : "");
  const portrait = document.createElement("div");
  portrait.className = "clportrait";
  const img = document.createElement("img");
  img.alt = "";
  img.src = "https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/portrait/" + (dex || "0004") + "/" + (emotion || "Normal") + ".png";
  img.addEventListener("error", () => {
    img.remove();
    portrait.textContent = String(name || "?").charAt(0).toUpperCase();
  });
  portrait.appendChild(img);
  const msg = document.createElement("div");
  msg.className = "clmsg";
  const head = document.createElement("div");
  const nameEl = document.createElement("span");
  nameEl.className = "clname";
  nameEl.textContent = name || "Someone";
  const tsEl = document.createElement("span");
  tsEl.className = "clts";
  const d = new Date(ts || Date.now());
  tsEl.textContent = (d.getHours() < 10 ? "0" : "") + d.getHours() + ":" + (d.getMinutes() < 10 ? "0" : "") + d.getMinutes();
  head.appendChild(nameEl);
  head.appendChild(tsEl);
  const textEl = document.createElement("div");
  textEl.textContent = text;
  msg.appendChild(head);
  msg.appendChild(textEl);
  row.appendChild(portrait);
  row.appendChild(msg);
  body.appendChild(row);
  while (body.children.length > CHATLOG.max) body.removeChild(body.firstChild);
  if (CHATLOG.collapsed) {
    if (!mine) CHATLOG.unread++;
    chatLogTitle();
  } else if (stick || mine) {
    body.scrollTop = body.scrollHeight;
  }
}

function showBubble(raw) {
  const parsedOwn = parseMessage(raw);
  chatLogAdd("You", DEX, parsedOwn.text, parsedOwn.emotion, true, Date.now());
  showBubbleFor(sceneRef, "me", player, DEX, raw);
  sendChat(raw);
}

function showBubbleFor(scene, key, target, dex, raw) {
  const parsed = parseMessage(raw);
  let b = bubbles[key];
  if (!b) {
    b = makeBubble(scene);
    bubbles[key] = b;
  }
  b.target = target;
  b.visible = true;
  b.txt.setText(parsed.text);

  const texKey = "portrait_" + dex + "_" + parsed.emotion;
  if (scene.textures.exists(texKey)) {
    b.portrait.setTexture(texKey);
    b.portrait.setDisplaySize(48, 48);
    b.portrait.setVisible(true);
  } else {
    const url = "https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/portrait/" + dex + "/" + parsed.emotion + ".png";
    scene.load.image(texKey, url);
    scene.load.once("complete", () => {
      if (scene.textures.exists(texKey)) {
        b.portrait.setTexture(texKey);
        b.portrait.setDisplaySize(48, 48);
        b.portrait.setVisible(true);
      }
      positionBubbleObj(b);
    });
    scene.load.start();
  }

  positionBubbleObj(b);

  if (b.timer) b.timer.remove();
  b.timer = scene.time.delayedCall(5000, () => hideBubbleObj(b));
}

function positionBubbleObj(b) {
  if (!b.visible || !b.target) return;
  const pad = 7;
  const boxW = b.txt.width + pad * 2;
  const boxH = b.txt.height + pad * 2;
  const feet = b.target.feetOff !== undefined ? b.target.feetOff : TILE / 2 - 2;
  const ax = b.target.x + feet * Math.sin(viewRot);
  const ay = b.target.y + feet * Math.cos(viewRot);
  const boxX = -boxW / 2;
  const boxY = -74 - boxH;
  const cosA = Math.cos(-viewRot);
  const sinA = Math.sin(-viewRot);

  b.gfx.clear();
  b.gfx.save();
  b.gfx.translateCanvas(ax, ay);
  b.gfx.rotateCanvas(-viewRot);
  b.gfx.fillStyle(0xffffff, 0.95);
  b.gfx.fillRoundedRect(boxX, boxY, boxW, boxH, 6);
  b.gfx.fillTriangle(-6, boxY + boxH, 6, boxY + boxH, 0, boxY + boxH + 8);
  b.gfx.restore();

  const tx = boxX + pad;
  const ty = boxY + pad;
  b.txt.setRotation(-viewRot);
  b.txt.setPosition(ax + tx * cosA - ty * sinA, ay + tx * sinA + ty * cosA);

  if (b.portrait.visible) {
    const px = boxX - 28;
    const py = boxY + boxH / 2;
    b.portrait.setRotation(-viewRot);
    b.portrait.setPosition(ax + px * cosA - py * sinA, ay + px * sinA + py * cosA);
  }
}

function hideBubbleObj(b) {
  b.visible = false;
  b.gfx.clear();
  b.txt.setText("");
  b.portrait.setVisible(false);
}

function sendChat(raw) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "chat", text: raw }));
  }
}

function emotionForHp(ratio) {
  if (ratio <= 0) return "Dizzy";
  if (ratio <= 0.25) return "Pain";
  if (ratio <= 0.5) return "Worried";
  return "Normal";
}

function portraitUrl(emotion) {
  return "https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/portrait/" + DEX + "/" + emotion + ".png";
}

function slotCount() {
  return invCapacity;
}

const INVDRAG = { active: false, from: -1, startX: 0, startY: 0, ghost: null, srcEl: null, overEl: null, suppressClick: false, pointerId: null };

function invDragDown(ev, index, cell) {
  if (isGM || ev.button !== 0) return;
  if (INVDRAG.pointerId !== null) return;
  INVDRAG.pointerId = ev.pointerId;
  INVDRAG.from = index;
  INVDRAG.startX = ev.clientX;
  INVDRAG.startY = ev.clientY;
  INVDRAG.srcEl = cell;
  INVDRAG.active = false;
  window.addEventListener("pointermove", invDragMove);
  window.addEventListener("pointerup", invDragUp);
  window.addEventListener("pointercancel", invDragCancel);
}

function invDragSlotAt(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el || !el.closest) return null;
  return el.closest(".slot");
}

function invDragMove(ev) {
  if (ev.pointerId !== INVDRAG.pointerId) return;
  if (!INVDRAG.active) {
    if (Math.hypot(ev.clientX - INVDRAG.startX, ev.clientY - INVDRAG.startY) < 7) return;
    INVDRAG.active = true;
    const ghost = document.createElement("div");
    ghost.id = "invDragGhost";
    const stack = inventoryItems[INVDRAG.from];
    const path = stack ? itemIndex[stack.name] : null;
    if (path) {
      const img = document.createElement("img");
      img.src = encodeURI(path);
      ghost.appendChild(img);
    } else if (stack) {
      ghost.textContent = stack.name;
    }
    document.body.appendChild(ghost);
    INVDRAG.ghost = ghost;
    if (INVDRAG.srcEl) INVDRAG.srcEl.classList.add("dragsrc");
  }
  INVDRAG.ghost.style.left = (ev.clientX - 22) + "px";
  INVDRAG.ghost.style.top = (ev.clientY - 22) + "px";
  const over = invDragSlotAt(ev.clientX, ev.clientY);
  if (INVDRAG.overEl && INVDRAG.overEl !== over) INVDRAG.overEl.classList.remove("dragover");
  if (over && over !== INVDRAG.srcEl) over.classList.add("dragover");
  INVDRAG.overEl = over;
  ev.preventDefault();
}

function invDragEnd() {
  window.removeEventListener("pointermove", invDragMove);
  window.removeEventListener("pointerup", invDragUp);
  window.removeEventListener("pointercancel", invDragCancel);
  if (INVDRAG.ghost) INVDRAG.ghost.remove();
  if (INVDRAG.srcEl) INVDRAG.srcEl.classList.remove("dragsrc");
  if (INVDRAG.overEl) INVDRAG.overEl.classList.remove("dragover");
  INVDRAG.ghost = null;
  INVDRAG.srcEl = null;
  INVDRAG.overEl = null;
  INVDRAG.pointerId = null;
  INVDRAG.active = false;
}

function invDragCancel(ev) {
  if (ev.pointerId !== INVDRAG.pointerId) return;
  invDragEnd();
}

function invDragUp(ev) {
  if (ev.pointerId !== INVDRAG.pointerId) return;
  const wasActive = INVDRAG.active;
  const from = INVDRAG.from;
  const slotEl = wasActive ? invDragSlotAt(ev.clientX, ev.clientY) : null;
  const panel = document.getElementById("inventory");
  const rect = panel.getBoundingClientRect();
  const outside = ev.clientX < rect.left || ev.clientX > rect.right || ev.clientY < rect.top || ev.clientY > rect.bottom;
  invDragEnd();
  if (!wasActive) return;
  INVDRAG.suppressClick = true;
  setTimeout(() => { INVDRAG.suppressClick = false; }, 0);
  if (!inventoryItems[from]) return;
  if (outside) {
    if (typeof gmSend === "function") gmSend({ type: "inv_drop", slot: from });
    return;
  }
  if (!slotEl) return;
  const to = parseInt(slotEl.getAttribute("data-slot"), 10);
  if (!Number.isInteger(to) || to === from) return;
  if (inventoryItems[to]) gmSend({ type: "inv_combine", from: from, onto: to });
  else gmSend({ type: "inv_move", from: from, to: to });
}

function buildInventoryGrid() {
  const gridEl = document.getElementById("invGrid");
  gridEl.innerHTML = "";
  const total = slotCount();
  for (let i = 0; i < total; i++) {
    const cell = document.createElement("div");
    cell.className = "slot";
    const stack = inventoryItems[i];
    if (stack) {
      const iconPath = itemIndex[stack.name];
      if (iconPath) {
        const img = document.createElement("img");
        img.src = encodeURI(iconPath);
        img.alt = stack.name;
        img.title = stack.name;
        img.draggable = false;
        img.style.pointerEvents = "none";
        cell.appendChild(img);
      } else {
        cell.textContent = stack.name;
      }
      if (stack.count > 1) {
        const badge = document.createElement("div");
        badge.className = "badge";
        badge.textContent = stack.count;
        cell.appendChild(badge);
      }
      cell.style.cursor = "pointer";
      if (i === selectedSlot) {
        cell.classList.add("selected");
      }
      const slotIndex = i;
      cell.classList.add("hasitem");
      cell.addEventListener("click", () => {
        if (INVDRAG.suppressClick) {
          INVDRAG.suppressClick = false;
          return;
        }
        selectSlot(slotIndex);
      });
      cell.addEventListener("dragstart", (ev) => ev.preventDefault());
      cell.addEventListener("pointerdown", (ev) => invDragDown(ev, slotIndex, cell));
    }
    cell.setAttribute("data-slot", String(i));
    gridEl.appendChild(cell);
  }
}

function refreshInventoryPanel() {
  const ratio = playerMaxHp > 0 ? playerHp / playerMaxHp : 0;
  document.getElementById("invPortraitImg").src = portraitUrl(emotionForHp(ratio));
  document.getElementById("invCoins").textContent = String(invSheet.coins || 0);
  document.getElementById("invBag").textContent = (invSheet.accessories.back || "none") + " | " + inventoryItems.length + "/" + slotCount() + " slots";
  document.getElementById("invHead").textContent = invSheet.accessories.head || "-";
  document.getElementById("invNeck").textContent = invSheet.accessories.neck || "-";
  document.getElementById("invBack").textContent = invSheet.accessories.back || "-";
  buildInventoryGrid();
}

function selectSlot(i) {
  if (!inventoryItems[i]) return;
  if (selectedSlot === i) {
    selectedSlot = -1;
  } else {
    selectedSlot = i;
  }
  refreshInventoryPanel();
}

function toggleInventory() {
  if (isGM) return;
  inventoryOpen = !inventoryOpen;
  const panel = document.getElementById("inventory");
  if (inventoryOpen) {
    refreshInventoryPanel();
    panel.classList.remove("hidden");
    updateReadout("inventory open (free)");
  } else {
    panel.classList.add("hidden");
    updateReadout("inventory closed");
  }
}

function describeAction(action) {
  if (action.type === "move") return "move " + action.dir;
  if (action.type === "attack") return "move slot " + action.slot + " facing " + player.direction;
  if (action.type === "interact") return "interact / pickup";
  if (action.type === "drop") return "drop item";
  if (action.type === "use") return "use item";
  return action.type;
}

function updateReadout(action) {
  const el = document.getElementById("readout");
  if (!el) return;
  if (isGM) {
    el.textContent = "Turn: " + turnCount + "\nLast: " + action;
  } else {
    el.textContent = "Steps: " + stepCount + "\nState: " + state + "\nFacing: " + player.direction + "\nLast: " + action;
  }
}

function connectMultiplayer(scene) {
  const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
  const params = new URLSearchParams(location.search);
  const session = params.get("session") || "default";
  const pass = params.get("pass") || "";
  let wsUrl = wsProtocol + "//" + location.host + "/?session=" + encodeURIComponent(session);
  if (pass) {
    wsUrl = wsUrl + "&pass=" + encodeURIComponent(pass);
  }
  socket = new WebSocket(wsUrl);

  socket.addEventListener("message", (event) => {
    let data;
    try {
      data = JSON.parse(event.data);
    } catch (e) {
      return;
    }

    if (typeof worldHook === "function" && worldHook(scene, data)) return;

    if (data.type === "denied") {
      updateReadout(data.reason || "Access denied.");
      window.alert(data.reason || "Access denied.");
      return;
    }

    if (data.type === "init") {
      if (data.chatRange) CHATLOG.range = data.chatRange;
      myId = data.id;
      turnCount = data.turn;
      if (Array.isArray(data.map) && data.map.length > 0) {
        MAP = data.map;
        drawMap();
        scene.cameras.main.setBounds(0, 0, MAP[0].length * TILE, MAP.length * TILE);
      }
      if (data.sheet) {
        invSheet = data.sheet;
        invSheet.accessories = invSheet.accessories || { back: null, neck: null, head: null };
        invCapacity = Math.max(1, data.sheet.capacity || BASE_SLOTS);
      }
      if (Array.isArray(data.inventory)) {
        inventoryItems.length = 0;
        for (const entry of data.inventory) {
          inventoryItems.push({ name: entry.name, count: entry.count });
        }
        if (inventoryOpen) refreshInventoryPanel();
      }
      if (data.role === "gm") {
        isGM = true;
        player.setVisible(false);
        scene.cameras.main.stopFollow();
        document.getElementById("endSession").classList.remove("hidden");
        updateReadout("GM / director mode");
      } else {
        const me = data.players[myId];
        if (me) {
          player.col = me.col;
          player.row = me.row;
          player.direction = me.direction;
          player.hp = me.hp;
          player.maxHp = me.maxHp;
          player.mp = me.mp;
          player.maxMp = me.maxMp;
          playerHp = me.hp;
          playerMaxHp = me.maxHp;
          player.x = tilePixelX(player.col);
          player.y = playerRestingY(player.col, player.row);
          loadSpecies(scene, me.dex, (okDex) => {
            DEX = okDex;
            player.setTexture(okDex + "_idle");
            player.play(okDex + "_idle_" + player.direction);
          });
        }
      }
      for (const key in data.players) {
        const p = data.players[key];
        if (p.id !== myId) {
          addOtherPlayer(scene, p);
        }
      }
      floorItems = data.floorItems || [];
      renderAllFloorItems(scene);
    } else if (data.type === "itemadded") {
      floorItems.push({ col: data.col, row: data.row, name: data.name });
      renderFloorItem(scene, { col: data.col, row: data.row, name: data.name });
      updatePlayerLift();
    } else if (data.type === "itemremoved") {
      for (let i = 0; i < floorItems.length; i++) {
        if (floorItems[i].col === data.col && floorItems[i].row === data.row) { floorItems.splice(i, 1); break; }
      }
      removeFloorItemSprite(data.col, data.row);
      updatePlayerLift();
    } else if (data.type === "pickedup") {
      addToInventory(data.name);
    } else if (data.type === "dropok") {
      removeFromInventory(data.name);
      updateReadout("dropped " + data.name);
    } else if (data.type === "dropfail") {
      updateReadout("no room to drop that");
    } else if (data.type === "join") {
      if (data.player.id !== myId) {
        addOtherPlayer(scene, data.player);
      }
    } else if (data.type === "moved") {
      if (data.id === myId) {
        player.direction = data.direction;
        player.col = data.col;
        player.row = data.row;
        const tx = tilePixelX(data.col);
        const ty = playerRestingY(data.col, data.row);
        player.play(DEX + "_walk_" + data.direction);
        stepCount = stepCount + 1;
        scene.tweens.add({ targets: player, x: tx, y: ty, duration: 110, onComplete: () => { player.play(DEX + "_idle_" + player.direction); state = "input"; updateReadout("moved " + data.direction); } });
      } else {
        const sprite = otherPlayers[data.id];
        if (sprite && sprite !== "loading") {
          sprite.direction = data.direction;
          const tx = tilePixelX(data.col);
          const ty = tilePixelY(data.row);
          sprite.play(sprite.dex + "_walk_" + data.direction);
          scene.tweens.add({ targets: sprite, x: tx, y: ty, duration: 110, onComplete: () => { if (sprite.active && sprite.anims) sprite.play(sprite.dex + "_idle_" + sprite.direction); } });
        }
      }
    } else if (data.type === "moveblocked") {
      player.direction = data.direction;
      player.play(DEX + "_idle_" + data.direction);
      state = "input";
      updateReadout("blocked");
    } else if (data.type === "gmchat") {
      addGmLine(data.text, data.ts);
    } else if (data.type === "face") {
      const sprite = otherPlayers[data.id];
      if (sprite && sprite !== "loading") {
        sprite.direction = data.direction;
        sprite.play(sprite.dex + "_idle_" + data.direction);
      }
    } else if (data.type === "resolve") {
      turnCount = data.turn;
      for (const entry of data.players) {
        if (entry.id === myId) {
          player.direction = entry.direction;
          player.col = entry.col;
          player.row = entry.row;
          const tx = tilePixelX(entry.col);
          const ty = playerRestingY(entry.col, entry.row);
          if (player.x !== tx || player.y !== ty) {
            player.play(DEX + "_walk_" + entry.direction);
            scene.tweens.add({ targets: player, x: tx, y: ty, duration: 120, onComplete: () => { player.play(DEX + "_idle_" + player.direction); } });
          } else {
            player.play(DEX + "_idle_" + entry.direction);
          }
        } else {
          const sprite = otherPlayers[entry.id];
          if (sprite && sprite !== "loading") {
            sprite.direction = entry.direction;
            const tx = tilePixelX(entry.col);
            const ty = tilePixelY(entry.row);
            if (sprite.x !== tx || sprite.y !== ty) {
              sprite.play(sprite.dex + "_walk_" + entry.direction);
              scene.tweens.add({ targets: sprite, x: tx, y: ty, duration: 120, onComplete: () => { if (sprite.active && sprite.anims) sprite.play(sprite.dex + "_idle_" + sprite.direction); } });
            } else {
              sprite.play(sprite.dex + "_idle_" + entry.direction);
            }
          }
        }
      }
      state = "input";
      updateReadout("turn " + turnCount);
    } else if (data.type === "chat") {
      if (!isGM) {
        const parsedIn = parseMessage(String(data.text || ""));
        chatLogAdd(data.name, data.dex, parsedIn.text, parsedIn.emotion, false, data.ts);
      }
      const sprite = otherPlayers[data.id];
      if (sprite && sprite !== "loading") {
        showBubbleFor(scene, "p" + data.id, sprite, data.dex || "0004", data.text);
      }
    } else if (data.type === "ended") {
      updateReadout(data.reason ? data.reason : "dungeon ended by GM");
      if (worldPlayerMode) {
        document.getElementById("leftText").textContent = data.reason ? data.reason : "Your character is saved. You can close this tab.";
        document.getElementById("leftOverlay").classList.remove("hidden");
        document.getElementById("exitWorld").classList.add("hidden");
      } else if (data.reason) {
        window.alert(data.reason);
      }
    } else if (data.type === "leave") {
      if (typeof combatHolds === "function" && combatHolds(data.id)) return;
      removeOtherPlayer(data.id);
    }
  });
}

function addOtherPlayer(scene, p) {
  if (otherPlayers[p.id]) return;
  otherPlayers[p.id] = "loading";
  loadSpecies(scene, p.dex || "0004", (okDex) => {
    if (otherPlayers[p.id] !== "loading") return;
    const sprite = scene.add.sprite(tilePixelX(p.col), tilePixelY(p.row), okDex + "_idle");
    sprite.setOrigin(0.5, 1);
    sprite.setScale(1.5);
    sprite.setDepth(10);
    sprite.dex = okDex;
    sprite.direction = p.direction;
    sprite.hp = p.hp;
    sprite.maxHp = p.maxHp;
    sprite.mp = p.mp;
    sprite.maxMp = p.maxMp;
    sprite.play(okDex + "_idle_" + p.direction);
    otherPlayers[p.id] = sprite;
  });
}

function updateOtherPlayer(scene, data) {
  const sprite = otherPlayers[data.id];
  if (!sprite || sprite === "loading") return;
  sprite.direction = data.direction;
  const targetX = tilePixelX(data.col);
  const targetY = tilePixelY(data.row);
  if (sprite.x !== targetX || sprite.y !== targetY) {
    sprite.play(sprite.dex + "_walk_" + data.direction);
    scene.tweens.add({
      targets: sprite,
      x: targetX,
      y: targetY,
      duration: 120,
      onComplete: () => {
        sprite.play(sprite.dex + "_idle_" + sprite.direction);
      }
    });
  } else {
    sprite.play(sprite.dex + "_idle_" + data.direction);
  }
}

function removeOtherPlayer(id) {
  const sprite = otherPlayers[id];
  if (sprite === "loading") {
    delete otherPlayers[id];
  } else if (sprite) {
    sprite.destroy();
    delete otherPlayers[id];
  }
  const b = bubbles["p" + id];
  if (b) {
    if (b.timer) b.timer.remove();
    b.gfx.destroy();
    b.txt.destroy();
    b.portrait.destroy();
    delete bubbles["p" + id];
  }
}

function sendFace() {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "face", direction: player.direction }));
  }
}

function sendIntent(dir) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "intent", dir: dir }));
  }
}

function sendMove(dir) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "move", dir: dir }));
  }
}

function sendGmChat(text) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "gmchat", text: text }));
  }
}

function addGmLine(text, ts) {
  const body = document.getElementById("gmlogbody");
  if (!body) return;
  const d = new Date(ts || Date.now());
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const line = document.createElement("div");
  line.className = "gmline";
  const stamp = document.createElement("span");
  stamp.className = "gmts";
  stamp.textContent = "[" + hh + ":" + mm + "] ";
  const bodyText = document.createElement("span");
  bodyText.textContent = 'GM : "' + text + '"';
  line.appendChild(stamp);
  line.appendChild(bodyText);
  body.insertBefore(line, body.firstChild);
  body.scrollTop = 0;
}
