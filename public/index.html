<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PMD Web</title>
<style>
  body { margin: 0; background: #1a1a2e; font-family: sans-serif; }
  #game { display: flex; justify-content: center; padding-top: 20px; }
  #chat { display: flex; justify-content: center; padding: 12px; }
  #chatInput {
    width: 640px;
    padding: 10px 12px;
    font-size: 14px;
    border: none;
    border-radius: 6px;
    background: #2d2d44;
    color: #ffffff;
    outline: none;
  }
  #chatInput::placeholder { color: #8888aa; }

  #endSession {
    position: fixed; top: 12px; right: 12px;
    padding: 8px 14px; font-size: 14px;
    border: none; border-radius: 6px;
    background: #c0392b; color: #ffffff; cursor: pointer;
    z-index: 10;
  }
  #endSession.hidden { display: none; }

  #inventory {
    width: 664px;
    margin: 0 auto 24px auto;
    border: 2px solid #ffffff;
    border-radius: 8px;
    background: rgba(120,120,150,0.15);
    padding: 14px;
    color: #ffffff;
    box-sizing: border-box;
  }
  #inventory.hidden { display: none; }
  #invTop { display: flex; gap: 18px; align-items: center; margin-bottom: 14px; }
  #invPortrait {
    width: 74px; height: 74px;
    border: 2px solid #4a6cff;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.25);
    flex: none;
  }
  #invPortrait img { width: 64px; height: 64px; image-rendering: pixelated; }
  #invStats { font-size: 14px; line-height: 1.9; }
  #invStats .row { display: flex; gap: 24px; }
  #invGrid {
    border: 2px solid #ffd23f;
    border-radius: 6px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    background: rgba(0,0,0,0.15);
  }
  .slot {
    aspect-ratio: 1 / 1;
    border: 1px solid #55557a;
    border-radius: 4px;
    background: rgba(0,0,0,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; text-align: center; color: #d0d0e0;
    padding: 3px; box-sizing: border-box;
    position: relative;
  }
  .slot img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  .slot.selected { border: 2px solid #ffffff; box-shadow: 0 0 6px rgba(255,255,255,0.7); }
  .badge {
    position: absolute;
    top: 2px; right: 4px;
    font-size: 12px; font-weight: bold;
    color: #ffffff;
    text-shadow: 0 0 3px #000000, 0 0 3px #000000;
    pointer-events: none;
  }
</style>
</head>
<body>
<button id="endSession" class="hidden">End Session</button>
<div id="game"></div>
<div id="chat">
  <input id="chatInput" type="text" autocomplete="off" placeholder="Say something... add an expression like [Happy], [Angry], [Pain]" />
</div>
<div id="inventory" class="hidden">
  <div id="invTop">
    <div id="invPortrait"><img id="invPortraitImg" alt="" /></div>
    <div id="invStats">
      <div class="row"><span>Pokecoins: <span id="invCoins">0</span></span><span>Bag: <span id="invBag">none (10 slots)</span></span></div>
      <div class="row"><span>Head: <span id="invHead">-</span></span><span>Neck: <span id="invNeck">-</span></span><span>Back: <span id="invBack">-</span></span></div>
    </div>
  </div>
  <div id="invGrid"></div>
</div>
<script src="phaser.min.js"></script>
<script>
const TILE = 48;
let DEX = "0004";

const SPECIES = {
  "0004": { walk: { fw: 32, fh: 32, cols: 4 }, idle: { fw: 32, fh: 40, cols: 4 } },
  "0025": { walk: { fw: 32, fh: 40, cols: 4 }, idle: { fw: 40, fh: 56, cols: 6 } },
  "0133": { walk: { fw: 40, fh: 48, cols: 7 }, idle: { fw: 24, fh: 32, cols: 2 } },
  "0495": { walk: { fw: 32, fh: 32, cols: 4 }, idle: { fw: 32, fh: 40, cols: 4 } }
};

const DIR_ORDER = ["down", "downright", "right", "upright", "up", "upleft", "left", "downleft"];

const SPECIES_BASE = "https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/sprite/";
const loadedSpecies = {};
const loadingSpecies = {};

function parseAnimDims(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, "text/xml");
  const anims = doc.getElementsByTagName("Anim");
  const out = {};
  for (let i = 0; i < anims.length; i++) {
    const nameEl = anims[i].getElementsByTagName("Name")[0];
    if (!nameEl) continue;
    const name = nameEl.textContent;
    if (name !== "Walk" && name !== "Idle") continue;
    const fwEl = anims[i].getElementsByTagName("FrameWidth")[0];
    const fhEl = anims[i].getElementsByTagName("FrameHeight")[0];
    const durs = anims[i].getElementsByTagName("Duration");
    if (!fwEl || !fhEl || durs.length === 0) continue;
    out[name.toLowerCase()] = { fw: parseInt(fwEl.textContent, 10), fh: parseInt(fhEl.textContent, 10), cols: durs.length };
  }
  return out;
}

function buildSpeciesAnims(scene, dex, dims) {
  for (let d = 0; d < 8; d++) {
    const dir = DIR_ORDER[d];
    if (!scene.anims.exists(dex + "_walk_" + dir)) {
      scene.anims.create({ key: dex + "_walk_" + dir, frames: scene.anims.generateFrameNumbers(dex + "_walk", { start: d * dims.walk.cols, end: d * dims.walk.cols + dims.walk.cols - 1 }), frameRate: 8, repeat: -1 });
    }
    if (!scene.anims.exists(dex + "_idle_" + dir)) {
      scene.anims.create({ key: dex + "_idle_" + dir, frames: scene.anims.generateFrameNumbers(dex + "_idle", { start: d * dims.idle.cols, end: d * dims.idle.cols + dims.idle.cols - 1 }), frameRate: 4, repeat: -1 });
    }
  }
}

function loadSpecies(scene, dex, cb) {
  if (!dex) { cb("0004"); return; }
  if (loadedSpecies[dex] === true) { cb(dex); return; }
  if (loadedSpecies[dex] === false) { cb("0004"); return; }
  if (loadingSpecies[dex]) { loadingSpecies[dex].push(cb); return; }
  loadingSpecies[dex] = [cb];
  const done = (okDex) => {
    const list = loadingSpecies[dex] || [];
    delete loadingSpecies[dex];
    for (const fn of list) fn(okDex);
  };
  fetch(SPECIES_BASE + dex + "/AnimData.xml").then((r) => {
    if (!r.ok) throw new Error("no anim data");
    return r.text();
  }).then((xml) => {
    const dims = parseAnimDims(xml);
    if (!dims.walk) { loadedSpecies[dex] = false; done("0004"); return; }
    if (!dims.idle) dims.idle = dims.walk;
    scene.load.spritesheet(dex + "_walk", SPECIES_BASE + dex + "/Walk-Anim.png", { frameWidth: dims.walk.fw, frameHeight: dims.walk.fh });
    scene.load.spritesheet(dex + "_idle", SPECIES_BASE + dex + "/Idle-Anim.png", { frameWidth: dims.idle.fw, frameHeight: dims.idle.fh });
    scene.load.once("complete", () => {
      if (scene.textures.exists(dex + "_walk") && scene.textures.exists(dex + "_idle")) {
        buildSpeciesAnims(scene, dex, dims);
        loadedSpecies[dex] = true;
        done(dex);
      } else {
        loadedSpecies[dex] = false;
        done("0004");
      }
    });
    scene.load.start();
  }).catch(() => { loadedSpecies[dex] = false; done("0004"); });
}

const MAP = [
  "############################",
  "############################",
  "##.......#########........##",
  "##.......#########........##",
  "##........................##",
  "##.......####..###........##",
  "##.......####..###........##",
  "#############..#############",
  "###########......###########",
  "###########......###########",
  "###########......###########",
  "###########......###########",
  "#############..#############",
  "##........###..###........##",
  "##........###..###........##",
  "##........................##",
  "##........########........##",
  "##........########........##",
  "############################",
  "############################"
];

const DELTAS = {
  up: { dc: 0, dr: -1 },
  down: { dc: 0, dr: 1 },
  left: { dc: -1, dr: 0 },
  right: { dc: 1, dr: 0 },
  upleft: { dc: -1, dr: -1 },
  upright: { dc: 1, dr: -1 },
  downleft: { dc: -1, dr: 1 },
  downright: { dc: 1, dr: 1 }
};

const EMOTIONS = ["Angry", "Crying", "Determined", "Dizzy", "Happy", "Inspired", "Joyous", "Normal", "Pain", "Sad", "Shouting", "Sigh", "Special0", "Special1", "Special2", "Special3", "Stunned", "Surprised", "Teary-Eyed", "Worried"];
const EMOTION_LOOKUP = {};
for (let i = 0; i < EMOTIONS.length; i++) {
  EMOTION_LOOKUP[EMOTIONS[i].toLowerCase()] = EMOTIONS[i];
}

const BASE_SLOTS = 10;
const BAG_BONUS = {
  none: 0,
  RescueBag: 5,
  WhiteBackpack: 10,
  MerchantSache: 30
};
let carriedBag = "none";

const config = {
  type: Phaser.AUTO,
  width: 640,
  height: 480,
  pixelArt: true,
  parent: "game",
  backgroundColor: "#1a1a2e",
  loader: { crossOrigin: "anonymous" },
  scene: {
    preload: preload,
    create: create,
    update: update
  }
};

let player;
let readout;
let turnCount = 1;
let state = "input";
let lockedAction = null;

let sceneRef;
let chatActive = false;
let isGM = false;
let socket = null;
let myId = null;
const otherPlayers = {};
const bubbles = {};

let inventoryOpen = false;
let playerHp = 40;
let playerMaxHp = 40;
const inventoryItems = [{ name: "Oran Berry", count: 3 }, { name: "Apple", count: 1 }];
let itemIndex = {};

const floorItems = [
  { col: 11, row: 9, name: "Oran Berry" },
  { col: 16, row: 9, name: "Apple" }
];
const floorItemSprites = {};
let selectedSlot = -1;
const ITEM_LIFT = 10;

function preload() {
  for (const dex in SPECIES) {
    const s = SPECIES[dex];
    this.load.spritesheet(dex + "_walk", "sprites/" + dex + "/Walk-Anim.png", { frameWidth: s.walk.fw, frameHeight: s.walk.fh });
    this.load.spritesheet(dex + "_idle", "sprites/" + dex + "/Idle-Anim.png", { frameWidth: s.idle.fw, frameHeight: s.idle.fh });
  }
}

function create() {
  sceneRef = this;

  fetch("items-index.json").then((r) => r.json()).then((data) => {
    itemIndex = data;
    placeFloorItems(sceneRef);
    if (inventoryOpen) refreshInventoryPanel();
  }).catch(() => {});

  connectMultiplayer(this);

  const g = this.add.graphics();
  for (let r = 0; r < MAP.length; r++) {
    for (let c = 0; c < MAP[r].length; c++) {
      const isWall = MAP[r][c] === "#";
      g.fillStyle(isWall ? 0x24243a : 0x3a3a55, 1);
      g.fillRect(c * TILE, r * TILE, TILE - 2, TILE - 2);
    }
  }

  for (const dex in SPECIES) {
    const s = SPECIES[dex];
    for (let d = 0; d < 8; d++) {
      const dir = DIR_ORDER[d];
      this.anims.create({ key: dex + "_walk_" + dir, frames: this.anims.generateFrameNumbers(dex + "_walk", { start: d * s.walk.cols, end: d * s.walk.cols + s.walk.cols - 1 }), frameRate: 8, repeat: -1 });
      this.anims.create({ key: dex + "_idle_" + dir, frames: this.anims.generateFrameNumbers(dex + "_idle", { start: d * s.idle.cols, end: d * s.idle.cols + s.idle.cols - 1 }), frameRate: 4, repeat: -1 });
    }
    loadedSpecies[dex] = true;
  }

  player = this.add.sprite(0, 0, DEX + "_idle");
  player.setOrigin(0.5, 1);
  player.setScale(1.5);
  player.col = 13;
  player.row = 9;
  player.direction = "down";
  player.x = tilePixelX(player.col);
  player.y = tilePixelY(player.row);
  player.play(DEX + "_idle_down");
  player.setDepth(10);

  this.cameras.main.setBounds(0, 0, MAP[0].length * TILE, MAP.length * TILE);
  this.cameras.main.startFollow(player, true, 0.12, 0.12);

  this.input.on("pointermove", (pointer) => {
    if (!isGM || !pointer.isDown) return;
    const cam = this.cameras.main;
    cam.scrollX = cam.scrollX - (pointer.x - pointer.prevPosition.x) / cam.zoom;
    cam.scrollY = cam.scrollY - (pointer.y - pointer.prevPosition.y) / cam.zoom;
  });
  this.input.on("wheel", (pointer, over, dx, dy) => {
    if (!isGM) return;
    const cam = this.cameras.main;
    let z = cam.zoom - dy * 0.001;
    if (z < 0.3) z = 0.3;
    if (z > 2.5) z = 2.5;
    cam.setZoom(z);
  });

  const endBtn = document.getElementById("endSession");
  endBtn.addEventListener("click", () => {
    if (!isGM) return;
    if (!window.confirm("End this dungeon session?")) return;
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ type: "endSession" }));
    }
  });

  readout = this.add.text(12, 12, "", { fontSize: "13px", color: "#ffffff", fontFamily: "monospace" });
  readout.setScrollFactor(0);
  readout.setDepth(1000);
  updateReadout("none");

  const kb = this.input.keyboard;
  kb.on("keydown-Q", (e) => { if (e.repeat || chatActive) return; onDirection(this, "upleft"); });
  kb.on("keydown-W", (e) => { if (e.repeat || chatActive) return; onDirection(this, "up"); });
  kb.on("keydown-E", (e) => { if (e.repeat || chatActive) return; onDirection(this, "upright"); });
  kb.on("keydown-A", (e) => { if (e.repeat || chatActive) return; onDirection(this, "left"); });
  kb.on("keydown-D", (e) => { if (e.repeat || chatActive) return; onDirection(this, "right"); });
  kb.on("keydown-Z", (e) => { if (e.repeat || chatActive) return; onDirection(this, "downleft"); });
  kb.on("keydown-X", (e) => { if (e.repeat || chatActive) return; onDirection(this, "down"); });
  kb.on("keydown-C", (e) => { if (e.repeat || chatActive) return; onDirection(this, "downright"); });
  kb.on("keydown-H", (e) => { if (e.repeat || chatActive) return; lockAction(this, { type: "attack", slot: 1 }); });
  kb.on("keydown-J", (e) => { if (e.repeat || chatActive) return; lockAction(this, { type: "attack", slot: 2 }); });
  kb.on("keydown-K", (e) => { if (e.repeat || chatActive) return; lockAction(this, { type: "attack", slot: 3 }); });
  kb.on("keydown-L", (e) => { if (e.repeat || chatActive) return; lockAction(this, { type: "attack", slot: 4 }); });
  kb.on("keydown-S", (e) => { if (e.repeat || chatActive) return; toggleInventory(); });
  kb.on("keydown-F", (e) => { if (e.repeat || chatActive) return; lockAction(this, { type: "interact" }); });
  kb.on("keydown-G", (e) => {
    if (e.repeat || chatActive) return;
    if (state !== "input") return;
    if (selectedSlot < 0 || !inventoryItems[selectedSlot]) { updateReadout("select an item first"); return; }
    if (hasFloorItemAt(player.col, player.row)) { updateReadout("tile already has an item"); return; }
    lockAction(this, { type: "drop", slot: selectedSlot });
  });
  kb.on("keydown-R", (e) => { if (e.repeat || chatActive) return; lockAction(this, { type: "use" }); });
  kb.on("keydown-O", (e) => { if (e.repeat || chatActive) return; debugHp(-8); });
  kb.on("keydown-P", (e) => { if (e.repeat || chatActive) return; debugHp(8); });
  kb.on("keydown-B", (e) => { if (e.repeat || chatActive) return; cycleBag(); });
  kb.on("keydown-SPACE", (e) => {
    if (e.repeat || chatActive || isGM) return;
    e.preventDefault();
    if (state !== "input") return;
    sendIntent(null);
    state = "waiting";
    updateReadout("wait (waiting for turn)");
  });

  const input = document.getElementById("chatInput");
  input.addEventListener("focus", () => { chatActive = true; });
  input.addEventListener("blur", () => { chatActive = false; });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const value = input.value.trim();
      if (value.length > 0) {
        showBubble(value);
      }
      input.value = "";
    }
  });
}

function update() {
  for (const key in bubbles) {
    if (bubbles[key].visible) {
      positionBubbleObj(bubbles[key]);
    }
  }
}

function tilePixelX(col) {
  return col * TILE + TILE / 2;
}

function tilePixelY(row) {
  return row * TILE + TILE - 2;
}

function isFloor(col, row) {
  if (row < 0 || row >= MAP.length) return false;
  if (col < 0 || col >= MAP[row].length) return false;
  return MAP[row][col] === ".";
}

function onDirection(scene, dir) {
  if (isGM || state !== "input") return;

  if (player.direction !== dir) {
    player.direction = dir;
    player.play(DEX + "_idle_" + dir);
    updateReadout("face " + dir);
    sendFace();
    return;
  }

  sendIntent(dir);
  state = "waiting";
  updateReadout("locked move " + dir + " (waiting for turn)");
}

function lockAction(scene, action) {
  if (isGM || state !== "input") return;

  lockedAction = action;
  state = "locked";
  updateReadout("LOCKED " + describeAction(action));

  scene.time.delayedCall(220, () => resolveTurn(scene));
}

function resolveTurn(scene) {
  state = "resolving";

  if (lockedAction.type === "interact") {
    tryPickup();
  } else if (lockedAction.type === "drop") {
    doDrop(scene);
  }

  endTurn();
}

function endTurn() {
  lockedAction = null;
  state = "input";
  updateReadout("turn ready");
}

function ensureItemTexture(scene, name, cb) {
  const key = "item_" + name;
  if (scene.textures.exists(key)) {
    cb(key);
    return;
  }
  const iconPath = itemIndex[name];
  if (!iconPath) {
    cb(null);
    return;
  }
  scene.load.image(key, encodeURI(iconPath));
  scene.load.once("complete", () => {
    cb(scene.textures.exists(key) ? key : null);
  });
  scene.load.start();
}

function placeFloorItems(scene) {
  for (let i = 0; i < floorItems.length; i++) {
    const item = floorItems[i];
    ensureItemTexture(scene, item.name, (key) => {
      if (!key) return;
      const img = scene.add.image(item.col * TILE + TILE / 2, item.row * TILE + TILE / 2, key);
      img.setDisplaySize(30, 30);
      img.setDepth(5);
      floorItemSprites[item.col + "," + item.row] = img;
    });
  }
}

function tryPickup() {
  let found = -1;
  for (let i = 0; i < floorItems.length; i++) {
    if (floorItems[i].col === player.col && floorItems[i].row === player.row) {
      found = i;
      break;
    }
  }
  if (found === -1) {
    updateReadout("nothing to pick up");
    return;
  }
  const name = floorItems[found].name;
  const key = player.col + "," + player.row;
  let stack = null;
  for (let i = 0; i < inventoryItems.length; i++) {
    if (inventoryItems[i].name === name) {
      stack = inventoryItems[i];
      break;
    }
  }
  if (stack) {
    stack.count = stack.count + 1;
  } else {
    if (inventoryItems.length >= slotCount()) {
      updateReadout("bag full");
      return;
    }
    inventoryItems.push({ name: name, count: 1 });
  }
  floorItems.splice(found, 1);
  if (floorItemSprites[key]) {
    floorItemSprites[key].destroy();
    delete floorItemSprites[key];
  }
  updateReadout("picked up " + name);
  if (inventoryOpen) refreshInventoryPanel();
  updatePlayerLift();
}

function hasFloorItemAt(col, row) {
  for (let i = 0; i < floorItems.length; i++) {
    if (floorItems[i].col === col && floorItems[i].row === row) {
      return true;
    }
  }
  return false;
}

function playerRestingY(col, row) {
  return tilePixelY(row) - (hasFloorItemAt(col, row) ? ITEM_LIFT : 0);
}

function updatePlayerLift() {
  player.y = playerRestingY(player.col, player.row);
}

function doDrop(scene) {
  const slot = lockedAction.slot;
  const stack = inventoryItems[slot];
  if (!stack) {
    updateReadout("nothing to drop");
    return;
  }
  if (hasFloorItemAt(player.col, player.row)) {
    updateReadout("tile already has an item");
    return;
  }
  const name = stack.name;
  stack.count = stack.count - 1;
  if (stack.count <= 0) {
    inventoryItems.splice(slot, 1);
    selectedSlot = -1;
  }
  floorItems.push({ col: player.col, row: player.row, name: name });
  ensureItemTexture(scene, name, (key) => {
    if (!key) return;
    const img = scene.add.image(player.col * TILE + TILE / 2, player.row * TILE + TILE / 2, key);
    img.setDisplaySize(30, 30);
    img.setDepth(5);
    floorItemSprites[player.col + "," + player.row] = img;
  });
  updateReadout("dropped " + name);
  if (inventoryOpen) refreshInventoryPanel();
  updatePlayerLift();
}

function parseMessage(raw) {
  let emotion = "Normal";
  const tags = raw.match(/\[[^\]]+\]/g);
  if (tags) {
    for (let i = 0; i < tags.length; i++) {
      const inner = tags[i].slice(1, -1).trim().toLowerCase();
      if (EMOTION_LOOKUP[inner]) {
        emotion = EMOTION_LOOKUP[inner];
        break;
      }
    }
  }
  const text = raw.replace(/\[[^\]]*\]/g, "").replace(/\s+/g, " ").trim();
  return { text: text, emotion: emotion };
}

function makeBubble(scene) {
  const gfx = scene.add.graphics();
  gfx.setDepth(500);
  const txt = scene.add.text(0, 0, "", { fontSize: "13px", color: "#222233", fontFamily: "sans-serif", wordWrap: { width: 200 } });
  txt.setDepth(501);
  const portrait = scene.add.image(0, 0, "__DEFAULT");
  portrait.setDepth(501);
  portrait.setDisplaySize(48, 48);
  portrait.setVisible(false);
  return { gfx: gfx, txt: txt, portrait: portrait, target: null, timer: null, visible: false };
}

function showBubble(raw) {
  showBubbleFor(sceneRef, "me", player, DEX, raw);
  sendChat(raw);
}

function showBubbleFor(scene, key, target, dex, raw) {
  const parsed = parseMessage(raw);
  let b = bubbles[key];
  if (!b) {
    b = makeBubble(scene);
    bubbles[key] = b;
  }
  b.target = target;
  b.visible = true;
  b.txt.setText(parsed.text);

  const texKey = "portrait_" + dex + "_" + parsed.emotion;
  if (scene.textures.exists(texKey)) {
    b.portrait.setTexture(texKey);
    b.portrait.setDisplaySize(48, 48);
    b.portrait.setVisible(true);
  } else {
    const url = "https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/portrait/" + dex + "/" + parsed.emotion + ".png";
    scene.load.image(texKey, url);
    scene.load.once("complete", () => {
      if (scene.textures.exists(texKey)) {
        b.portrait.setTexture(texKey);
        b.portrait.setDisplaySize(48, 48);
        b.portrait.setVisible(true);
      }
      positionBubbleObj(b);
    });
    scene.load.start();
  }

  positionBubbleObj(b);

  if (b.timer) b.timer.remove();
  b.timer = scene.time.delayedCall(5000, () => hideBubbleObj(b));
}

function positionBubbleObj(b) {
  if (!b.visible || !b.target) return;
  const pad = 7;
  const boxW = b.txt.width + pad * 2;
  const boxH = b.txt.height + pad * 2;
  const boxX = b.target.x - boxW / 2;
  const boxY = b.target.y - 74 - boxH;

  b.gfx.clear();
  b.gfx.fillStyle(0xffffff, 0.95);
  b.gfx.fillRoundedRect(boxX, boxY, boxW, boxH, 6);
  b.gfx.fillTriangle(b.target.x - 6, boxY + boxH, b.target.x + 6, boxY + boxH, b.target.x, boxY + boxH + 8);

  b.txt.setPosition(boxX + pad, boxY + pad);

  if (b.portrait.visible) {
    b.portrait.setPosition(boxX - 28, boxY + boxH / 2);
  }
}

function hideBubbleObj(b) {
  b.visible = false;
  b.gfx.clear();
  b.txt.setText("");
  b.portrait.setVisible(false);
}

function sendChat(raw) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "chat", text: raw }));
  }
}

function emotionForHp(ratio) {
  if (ratio <= 0) return "Dizzy";
  if (ratio <= 0.25) return "Pain";
  if (ratio <= 0.5) return "Worried";
  return "Normal";
}

function portraitUrl(emotion) {
  return "https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/portrait/" + DEX + "/" + emotion + ".png";
}

function slotCount() {
  return BASE_SLOTS + BAG_BONUS[carriedBag];
}

function buildInventoryGrid() {
  const gridEl = document.getElementById("invGrid");
  gridEl.innerHTML = "";
  const total = slotCount();
  for (let i = 0; i < total; i++) {
    const cell = document.createElement("div");
    cell.className = "slot";
    const stack = inventoryItems[i];
    if (stack) {
      const iconPath = itemIndex[stack.name];
      if (iconPath) {
        const img = document.createElement("img");
        img.src = encodeURI(iconPath);
        img.alt = stack.name;
        img.title = stack.name;
        cell.appendChild(img);
      } else {
        cell.textContent = stack.name;
      }
      if (stack.count > 1) {
        const badge = document.createElement("div");
        badge.className = "badge";
        badge.textContent = stack.count;
        cell.appendChild(badge);
      }
      cell.style.cursor = "pointer";
      if (i === selectedSlot) {
        cell.classList.add("selected");
      }
      const slotIndex = i;
      cell.addEventListener("click", () => selectSlot(slotIndex));
    }
    gridEl.appendChild(cell);
  }
}

function refreshInventoryPanel() {
  const ratio = playerMaxHp > 0 ? playerHp / playerMaxHp : 0;
  document.getElementById("invPortraitImg").src = portraitUrl(emotionForHp(ratio));
  document.getElementById("invCoins").textContent = "0";
  document.getElementById("invBag").textContent = carriedBag + " | " + inventoryItems.length + "/" + slotCount() + " slots";
  document.getElementById("invHead").textContent = "-";
  document.getElementById("invNeck").textContent = "-";
  document.getElementById("invBack").textContent = "-";
  buildInventoryGrid();
}

function selectSlot(i) {
  if (!inventoryItems[i]) return;
  if (selectedSlot === i) {
    selectedSlot = -1;
  } else {
    selectedSlot = i;
  }
  refreshInventoryPanel();
}

function toggleInventory() {
  if (isGM) return;
  inventoryOpen = !inventoryOpen;
  const panel = document.getElementById("inventory");
  if (inventoryOpen) {
    refreshInventoryPanel();
    panel.classList.remove("hidden");
    updateReadout("inventory open (free)");
  } else {
    panel.classList.add("hidden");
    updateReadout("inventory closed");
  }
}

function cycleBag() {
  const order = ["none", "RescueBag", "WhiteBackpack", "MerchantSache"];
  const idx = order.indexOf(carriedBag);
  carriedBag = order[(idx + 1) % order.length];
  if (inventoryOpen) refreshInventoryPanel();
  updateReadout("bag: " + carriedBag + " (" + slotCount() + " slots)");
}

function debugHp(amount) {
  playerHp = playerHp + amount;
  if (playerHp < 0) playerHp = 0;
  if (playerHp > playerMaxHp) playerHp = playerMaxHp;
  if (inventoryOpen) refreshInventoryPanel();
  updateReadout("debug HP " + playerHp + "/" + playerMaxHp);
}

function describeAction(action) {
  if (action.type === "move") return "move " + action.dir;
  if (action.type === "attack") return "move slot " + action.slot + " facing " + player.direction;
  if (action.type === "interact") return "interact / pickup";
  if (action.type === "drop") return "drop item";
  if (action.type === "use") return "use item";
  return action.type;
}

function updateReadout(action) {
  readout.setText("Turn: " + turnCount + "\nState: " + state + "\nFacing: " + player.direction + "\nLast: " + action);
}

function connectMultiplayer(scene) {
  const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
  const params = new URLSearchParams(location.search);
  const session = params.get("session") || "default";
  const pass = params.get("pass") || "";
  let wsUrl = wsProtocol + "//" + location.host + "/?session=" + encodeURIComponent(session);
  if (pass) {
    wsUrl = wsUrl + "&pass=" + encodeURIComponent(pass);
  }
  socket = new WebSocket(wsUrl);

  socket.addEventListener("message", (event) => {
    let data;
    try {
      data = JSON.parse(event.data);
    } catch (e) {
      return;
    }

    if (data.type === "init") {
      myId = data.id;
      turnCount = data.turn;
      if (data.role === "gm") {
        isGM = true;
        player.setVisible(false);
        scene.cameras.main.stopFollow();
        document.getElementById("endSession").classList.remove("hidden");
        updateReadout("GM / director mode");
      } else {
        const me = data.players[myId];
        if (me) {
          player.col = me.col;
          player.row = me.row;
          player.direction = me.direction;
          player.x = tilePixelX(player.col);
          player.y = playerRestingY(player.col, player.row);
          loadSpecies(scene, me.dex, (okDex) => {
            DEX = okDex;
            player.setTexture(okDex + "_idle");
            player.play(okDex + "_idle_" + player.direction);
          });
        }
      }
      for (const key in data.players) {
        const p = data.players[key];
        if (p.id !== myId) {
          addOtherPlayer(scene, p);
        }
      }
    } else if (data.type === "join") {
      if (data.player.id !== myId) {
        addOtherPlayer(scene, data.player);
      }
    } else if (data.type === "face") {
      const sprite = otherPlayers[data.id];
      if (sprite && sprite !== "loading") {
        sprite.direction = data.direction;
        sprite.play(sprite.dex + "_idle_" + data.direction);
      }
    } else if (data.type === "resolve") {
      turnCount = data.turn;
      for (const entry of data.players) {
        if (entry.id === myId) {
          player.direction = entry.direction;
          player.col = entry.col;
          player.row = entry.row;
          const tx = tilePixelX(entry.col);
          const ty = playerRestingY(entry.col, entry.row);
          if (player.x !== tx || player.y !== ty) {
            player.play(DEX + "_walk_" + entry.direction);
            scene.tweens.add({ targets: player, x: tx, y: ty, duration: 120, onComplete: () => { player.play(DEX + "_idle_" + player.direction); } });
          } else {
            player.play(DEX + "_idle_" + entry.direction);
          }
        } else {
          const sprite = otherPlayers[entry.id];
          if (sprite && sprite !== "loading") {
            sprite.direction = entry.direction;
            const tx = tilePixelX(entry.col);
            const ty = tilePixelY(entry.row);
            if (sprite.x !== tx || sprite.y !== ty) {
              sprite.play(sprite.dex + "_walk_" + entry.direction);
              scene.tweens.add({ targets: sprite, x: tx, y: ty, duration: 120, onComplete: () => { sprite.play(sprite.dex + "_idle_" + sprite.direction); } });
            } else {
              sprite.play(sprite.dex + "_idle_" + entry.direction);
            }
          }
        }
      }
      state = "input";
      updateReadout("turn " + turnCount);
    } else if (data.type === "chat") {
      const sprite = otherPlayers[data.id];
      if (sprite && sprite !== "loading") {
        showBubbleFor(scene, "p" + data.id, sprite, data.dex || "0004", data.text);
      }
    } else if (data.type === "ended") {
      updateReadout("dungeon ended by GM");
    } else if (data.type === "leave") {
      removeOtherPlayer(data.id);
    }
  });
}

function addOtherPlayer(scene, p) {
  if (otherPlayers[p.id]) return;
  otherPlayers[p.id] = "loading";
  loadSpecies(scene, p.dex || "0004", (okDex) => {
    if (otherPlayers[p.id] !== "loading") return;
    const sprite = scene.add.sprite(tilePixelX(p.col), tilePixelY(p.row), okDex + "_idle");
    sprite.setOrigin(0.5, 1);
    sprite.setScale(1.5);
    sprite.setDepth(10);
    sprite.dex = okDex;
    sprite.direction = p.direction;
    sprite.play(okDex + "_idle_" + p.direction);
    otherPlayers[p.id] = sprite;
  });
}

function updateOtherPlayer(scene, data) {
  const sprite = otherPlayers[data.id];
  if (!sprite || sprite === "loading") return;
  sprite.direction = data.direction;
  const targetX = tilePixelX(data.col);
  const targetY = tilePixelY(data.row);
  if (sprite.x !== targetX || sprite.y !== targetY) {
    sprite.play(sprite.dex + "_walk_" + data.direction);
    scene.tweens.add({
      targets: sprite,
      x: targetX,
      y: targetY,
      duration: 120,
      onComplete: () => {
        sprite.play(sprite.dex + "_idle_" + sprite.direction);
      }
    });
  } else {
    sprite.play(sprite.dex + "_idle_" + data.direction);
  }
}

function removeOtherPlayer(id) {
  const sprite = otherPlayers[id];
  if (sprite === "loading") {
    delete otherPlayers[id];
  } else if (sprite) {
    sprite.destroy();
    delete otherPlayers[id];
  }
  const b = bubbles["p" + id];
  if (b) {
    if (b.timer) b.timer.remove();
    b.gfx.destroy();
    b.txt.destroy();
    b.portrait.destroy();
    delete bubbles["p" + id];
  }
}

function sendFace() {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "face", direction: player.direction }));
  }
}

function sendIntent(dir) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: "intent", dir: dir }));
  }
}

new Phaser.Game(config);
</script>
